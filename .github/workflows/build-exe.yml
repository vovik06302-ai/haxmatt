name: Build Windows .EXE Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Electron Builder
        run: |
          npm install
          npm install --no-save electron@^33.2.0 electron-builder@^25.1.8

      - name: Build 3D Web Application Bundle
        run: npm run build

      - name: Package Windows .EXE Installer (NSIS + Portable)
        run: npx electron-builder --win --x64 --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .EXE Installer to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wizard-Chess-3D-Windows-Installer
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish .EXE to GitHub Releases (on Tag or Manual Run)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.2.0-latest' || github.ref_name == 'master' && 'v1.2.0-latest' || github.ref_name }}
          name: "Wizard Chess 3D — Windows .EXE Installer"
          body: |
            ### Установка Wizard Chess 3D на Windows
            - **Wizard-Chess-3D-Setup-1.2.0.exe** — полноценный установочный файл Windows (с выбором папки установки и ярлыком на Рабочем столе).
            - **Wizard-Chess-3D-Portable-1.2.0.exe** — портативная версия (запуск без установки).
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
