appId: com.wizardchess3d.sanctum
productName: Wizard Chess 3D
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "Wizard-Chess-3D-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Wizard Chess 3D"
portable:
  artifactName: "Wizard-Chess-3D-Portable-${version}.${ext}"
